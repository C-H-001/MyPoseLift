data:
  train_cache: data/processed/h3wb_65_train_fold0.npz
  val_cache: data/processed/h3wb_65_val_fold0.npz
  window: 27
model:
  type: causal_tcn
  hidden_channels: 512
  num_blocks: 5
  kernel_size: 3
  dropout: 0.1
loss:
  part_weights:
    body: 1.0
    foot: 1.5
    head3: 1.0
    left_hand: 2.5
    right_hand: 2.5
  local_weights:
    left_hand: 1.0
    right_hand: 1.0
train:
  device: auto
  batch_size: 256
  num_workers: 4
  lr: 0.0005
  weight_decay: 0.01
  epochs: 10
  seed: 0
  out_dir: checkpoints/h3wb_tcn_t27
